# =============================================================================
# dnsmasq.conf  —  DHCP for the isolated lab subnet (AIR-GAPPED, NO NAT)
# CS4389 isolated Wi-Fi test lab. Team-owned hardware only.
# =============================================================================
#
# This hands out leases on 192.168.50.0/24 ONLY. There is deliberately:
#   - NO default gateway advertised (option 3 is cleared)  -> no uplink
#   - NO DNS server advertised (option 6 is cleared)       -> no name resolution
#   - NO NAT / IP forwarding set up anywhere               -> traffic can't leave
# The lab stays air-gapped. Do not add a gateway/DNS unless you intend to
# break isolation (don't — see docs/ISOLATION-PROCEDURES.md).
#
# The AP interface itself is given 192.168.50.1 statically by start-ap.sh.
# -----------------------------------------------------------------------------

# Only serve DHCP on the AP interface; never bind to anything else.
interface=wlan0
bind-interfaces

# Do NOT act as a DNS server / do not read /etc/resolv.conf.
port=0

# DHCP range on the isolated subnet. 12h leases are plenty for a lab.
dhcp-range=192.168.50.50,192.168.50.150,255.255.255.0,12h

# AP host address (matches the static IP start-ap.sh assigns to the interface).
dhcp-option=option:router           # (empty value) -> advertise NO gateway
dhcp-option=6                       # (empty value) -> advertise NO DNS server

# Authoritative on this isolated segment (faster lease handoff).
dhcp-authoritative

# Lease bookkeeping and logging (useful for client-check.sh / screenshots).
dhcp-leasefile=/var/lib/misc/dnsmasq.leases
log-dhcp
