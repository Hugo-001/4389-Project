  - supported types: .html, .js, .css (add more in CONTENT_TYPES in src/server.js)

Keep these so the backend keeps working:
  1. Open the page through the server (http://localhost:3000), never as file://.
     The API rejects requests from any other origin.
  2. Call the API with relative URLs ('/api/...'). The flows are:
       Register: POST /api/register/options -> startRegistration()   -> POST /api/register/verify
       Login:    POST /api/login/options    -> startAuthentication() -> POST /api/login/verify
       Session:  GET /api/session   Logout: POST /api/logout
  3. startRegistration / startAuthentication come from @simplewebauthn/browser (loaded below);
     they convert between the server's JSON and the browser's WebAuthn API.
============================================================================
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passkey Login</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    input, button { font-size: 16px; padding: 8px; margin: 4px 0; }
    input { width: 100%; box-sizing: border-box; }
    #status { margin-top: 16px; padding: 8px; background: #f2f2f2; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Passkey Login</h1>

  <label for="username">Username</label>
  <input id="username" autocomplete="username webauthn" placeholder="alice">

  <button id="register">Register</button>
  <button id="login">Log in</button>
  <button id="logout">Log out</button>

  <div id="status">Checking session...</div>

  <!-- Converts between the server's JSON options and the browser's WebAuthn API -->
  <script src="https://unpkg.com/@simplewebauthn/browser@14.0.0/dist/bundle/index.umd.min.js"></script>
  <script>
    const { startRegistration, startAuthentication } = SimpleWebAuthnBrowser;
    const status = (msg) => (document.getElementById('status').textContent = msg);
    const username = () => document.getElementById('username').value.trim();

    async function api(method, url, body) {
      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: body && JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      return data;
    }

    async function refreshSession() {
      try {
        const { user } = await api('GET', '/api/session');
        status(`Logged in as ${user.username}`);
      } catch {
        status('Not logged in');
      }
    }

    // Registration: get options -> authenticator creates a key pair -> server verifies and stores the public key
    document.getElementById('register').onclick = async () => {
      try {
        const options = await api('POST', '/api/register/options', { username: username() });
        const credential = await startRegistration({ optionsJSON: options });
        await api('POST', '/api/register/verify', credential);
        await refreshSession();
      } catch (err) {
        status(`Registration failed: ${err.message}`);
      }
    };

    // Login: get challenge -> authenticator signs it -> server checks the signature
    document.getElementById('login').onclick = async () => {
      try {
        const options = await api('POST', '/api/login/options', { username: username() || undefined });
        const assertion = await startAuthentication({ optionsJSON: options });
        await api('POST', '/api/login/verify', assertion);
        await refreshSession();
      } catch (err) {
        status(`Login failed: ${err.message}`);
      }
    };

    document.getElementById('logout').onclick = async () => {
      await api('POST', '/api/logout');
      await refreshSession();
    };

    refreshSession();
  </script>
</body>
</html>
