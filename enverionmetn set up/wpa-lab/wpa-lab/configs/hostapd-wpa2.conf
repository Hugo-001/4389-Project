# =============================================================================
# hostapd-wpa2.conf  —  WPA2-Personal (PSK/CCMP) test AP
# CS4389 isolated Wi-Fi test lab. Team-owned, air-gapped hardware only.
# =============================================================================
#
# >>> CHANGE THESE BEFORE USE <<<
#   - wpa_passphrase below is a PLACEHOLDER. Replace it.
#   - interface must match your adapter (see scripts/check-adapter.sh output).
#
# This file targets the 2.4 GHz band by default. To switch to 5 GHz, see the
# "5 GHz" comment block near the channel settings.
# -----------------------------------------------------------------------------

# --- Radio / interface -------------------------------------------------------
# Interface the Alfa AWUS036NHA (AR9271, ath9k_htc driver) comes up as.
# AR9271 is a 2.4 GHz-only chipset, so 5 GHz options will NOT work on it;
# the 5 GHz notes below apply only if you swap in a dual-band adapter.
interface=wlan0
driver=nl80211

# --- SSID (clearly labeled as a test network) --------------------------------
ssid=LAB-WPA2-TEST

# --- Band / channel (2.4 GHz default) ----------------------------------------
hw_mode=g
channel=6
# Pick a clear channel (1, 6, or 11 in the US) to avoid overlap in the lab.
#
# --- 5 GHz (only with a dual-band adapter, NOT the AR9271) --------------------
#   hw_mode=a
#   channel=36
#   ieee80211n=1
#   ieee80211ac=1
#   country_code=US     # required for many 5 GHz channels; set to your region
# -----------------------------------------------------------------------------

# 802.11n (HT) — fine on 2.4 GHz with ath9k_htc.
ieee80211n=1
wmm_enabled=1

# --- WPA2-Personal -----------------------------------------------------------
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP

# >>> PLACEHOLDER PASSPHRASE — CHANGE THIS <<<  (8–63 printable ASCII chars)
wpa_passphrase=ChangeMe-WPA2-Lab!

# --- Housekeeping ------------------------------------------------------------
# Broadcast SSID (set to 1 to hide; leave 0 for lab clarity).
ignore_broadcast_ssid=0
# Log to stdout at a useful level when run in foreground.
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2
