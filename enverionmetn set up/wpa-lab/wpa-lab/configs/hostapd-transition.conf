# =============================================================================
# hostapd-transition.conf  —  WPA2/WPA3 transition mode, PMF OPTIONAL
# CS4389 isolated Wi-Fi test lab. Team-owned, air-gapped hardware only.
# =============================================================================
#
# >>> CHANGE THESE BEFORE USE <<<
#   - Both wpa_passphrase AND sae_password are PLACEHOLDERS. Replace them.
#     In transition mode set them to the SAME secret so WPA2 (PSK) and WPA3
#     (SAE) clients use one credential.
#   - interface must match your adapter.
#
# REQUIRES a hostapd build with CONFIG_SAE=y (same as the WPA3 config).
#
# 2.4 GHz by default. See the 5 GHz block to switch (dual-band adapter only).
# -----------------------------------------------------------------------------

# --- Radio / interface -------------------------------------------------------
interface=wlan0
driver=nl80211

# --- SSID --------------------------------------------------------------------
ssid=LAB-TRANSITION-TEST

# --- Band / channel (2.4 GHz default) ----------------------------------------
hw_mode=g
channel=6
#
# --- 5 GHz (dual-band adapter only) ------------------------------------------
#   hw_mode=a
#   channel=36
#   ieee80211ac=1
#   country_code=US
# -----------------------------------------------------------------------------

ieee80211n=1
wmm_enabled=1

# --- WPA2 + WPA3 transition --------------------------------------------------
auth_algs=1
wpa=2
# Advertise BOTH PSK (WPA2) and SAE (WPA3) key management.
wpa_key_mgmt=WPA-PSK SAE
rsn_pairwise=CCMP
group_cipher=CCMP

# PMF OPTIONAL (1) — required for a working transition BSS: WPA3 clients get
# PMF, legacy WPA2-PSK clients that can't do PMF still associate.
ieee80211w=1

# Both credentials present; set them to the same secret.
# >>> PLACEHOLDER PASSPHRASES — CHANGE BOTH (keep them identical) <<<
wpa_passphrase=ChangeMe-Transition-Lab!
sae_password=ChangeMe-Transition-Lab!

# --- Housekeeping ------------------------------------------------------------
ignore_broadcast_ssid=0
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2
