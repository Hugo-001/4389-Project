# =============================================================================
# hostapd-wpa3.conf  —  WPA3-Personal (SAE) test AP, PMF REQUIRED
# CS4389 isolated Wi-Fi test lab. Team-owned, air-gapped hardware only.
# =============================================================================
#
# >>> CHANGE THESE BEFORE USE <<<
#   - sae_password below is a PLACEHOLDER. Replace it.
#   - interface must match your adapter (see scripts/check-adapter.sh output).
#
# REQUIRES a hostapd build with CONFIG_SAE=y. Run scripts/check-adapter.sh and
# start-ap.sh — they verify SAE support and tell you how to get a build with it
# if yours lacks it.
#
# 2.4 GHz by default. See the 5 GHz block to switch (needs a dual-band adapter;
# the AR9271 is 2.4 GHz only).
# -----------------------------------------------------------------------------

# --- Radio / interface -------------------------------------------------------
interface=wlan0
driver=nl80211

# --- SSID --------------------------------------------------------------------
ssid=LAB-WPA3-TEST

# --- Band / channel (2.4 GHz default) ----------------------------------------
hw_mode=g
channel=6
#
# --- 5 GHz (dual-band adapter only) ------------------------------------------
#   hw_mode=a
#   channel=36
#   ieee80211ac=1
#   country_code=US
# -----------------------------------------------------------------------------

ieee80211n=1
wmm_enabled=1

# --- WPA3-Personal (SAE) -----------------------------------------------------
auth_algs=1
wpa=2
# SAE only (pure WPA3). Transition mode is a separate config file.
wpa_key_mgmt=SAE
rsn_pairwise=CCMP
group_cipher=CCMP

# Protected Management Frames REQUIRED for WPA3 (2 = required).
ieee80211w=2

# WPA3 uses sae_password, NOT wpa_passphrase.
# >>> PLACEHOLDER PASSPHRASE — CHANGE THIS <<<
sae_password=ChangeMe-WPA3-Lab!

# Recommended SAE hardening for modern clients.
sae_require_mfp=1
# sae_groups=19 20 21   # uncomment to restrict to stronger ECC groups

# --- Housekeeping ------------------------------------------------------------
ignore_broadcast_ssid=0
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2
