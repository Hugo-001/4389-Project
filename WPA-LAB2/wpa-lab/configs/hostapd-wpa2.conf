# =============================================================================
# hostapd-wpa2.conf  —  WPA2-Personal (PSK/CCMP) test AP
# CS4389 isolated Wi-Fi test lab. 100% virtual — mac80211_hwsim, NO real radio.
# =============================================================================
#
# >>> CHANGE THIS BEFORE USE <<<
#   - wpa_passphrase below is a PLACEHOLDER. Replace it.
#
# interface= is the simulated radio assigned to WPA2 by scripts/setup-virtual.sh
# (role map: AP_WPA2_IFACE, default wlan0). start-ap.sh patches it at runtime if
# the live role map differs, so you normally do not edit it by hand.
#
# 2.4 GHz by default. hwsim radios also support 5 GHz — see the "5 GHz" block.
# -----------------------------------------------------------------------------

# --- Radio / interface (virtual) ---------------------------------------------
interface=wlan0
driver=nl80211

# --- SSID (clearly labeled as a test network) --------------------------------
ssid=LAB-WPA2-TEST

# --- Band / channel (2.4 GHz default) ----------------------------------------
hw_mode=g
channel=6
# Channel 6 matches LAB_CHANNEL in setup-virtual.sh so the monitor radio hears
# every BSS on the shared simulated medium. Keep all lab APs on one channel.
#
# --- 5 GHz (optional; hwsim supports it) -------------------------------------
#   hw_mode=a
#   channel=36
#   ieee80211n=1
#   ieee80211ac=1
#   country_code=US     # required for many 5 GHz channels; set to your region
# -----------------------------------------------------------------------------

# 802.11n (HT) — fine on 2.4 GHz with mac80211_hwsim.
ieee80211n=1
wmm_enabled=1

# --- WPA2-Personal -----------------------------------------------------------
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP

# >>> PLACEHOLDER PASSPHRASE — CHANGE THIS <<<  (8–63 printable ASCII chars)
wpa_passphrase=ChangeMe-WPA2-Lab!

# --- Housekeeping ------------------------------------------------------------
# Broadcast SSID (set to 1 to hide; leave 0 for lab clarity).
ignore_broadcast_ssid=0
# Log to stdout at a useful level when run in foreground.
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2
