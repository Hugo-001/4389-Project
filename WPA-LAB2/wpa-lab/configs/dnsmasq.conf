# =============================================================================
# dnsmasq.conf  —  Air-gap DHCP POLICY for the virtual lab (AIR-GAPPED, NO NAT)
# CS4389 isolated Wi-Fi test lab. 100% virtual — mac80211_hwsim, NO real radio.
# =============================================================================
#
# This file holds ONLY the air-gap policy shared by every lab AP. Deliberately:
#   - NO default gateway advertised (option 3 is cleared)  -> no uplink
#   - NO DNS server advertised (option 6 is cleared)       -> no name resolution
#   - NO NAT / IP forwarding set up anywhere               -> traffic can't leave
# The lab stays air-gapped. Do not add a gateway/DNS unless you intend to
# break isolation (don't — see docs/ISOLATION-PROCEDURES.md).
#
# The per-AP interface, DHCP range, lease file and pid file are passed on the
# command line by start-ap.sh (one dnsmasq instance per simulated AP), so the
# three APs can run at once on their own /24s:
#     wpa2 -> 192.168.50.0/24   wpa3 -> 192.168.51.0/24   transition -> .52.0/24
# Each AP interface itself is given 192.168.5X.1 statically by start-ap.sh.
# -----------------------------------------------------------------------------

# Do NOT act as a DNS server / do not read /etc/resolv.conf.
port=0

# Advertise NO gateway and NO DNS to clients (empty values clear the options).
dhcp-option=option:router           # (empty value) -> advertise NO gateway
dhcp-option=6                       # (empty value) -> advertise NO DNS server

# Authoritative on these isolated segments (faster lease handoff).
dhcp-authoritative

# Never bind to the wildcard; only to the interface start-ap.sh passes.
# (start-ap.sh passes --bind-dynamic --interface=<ap_iface> --except-interface=lo)

# Log DHCP activity (useful for client-check.sh / screenshots).
log-dhcp
